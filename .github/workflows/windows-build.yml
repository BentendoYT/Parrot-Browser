
name: Parrot Browser - Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest

    env:
      HOME: /root
      MOZBUILD_STATE_PATH: /root/.mozbuild

    container:
      image: librewolf.dev/librewolf/bsys6:windows

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Fetch Firefox source
        run: make fetch FF_CHANNEL=releases FF_BUILD=build1

      - name: Build Windows package
        run: make test-windows

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parrot-browser-windows
          path: |
            *.zip
            mozconfig.txt
          if-no-files-found: error
          retention-days: 7
