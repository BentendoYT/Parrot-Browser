name: Parrot - Windows Build

on:
  workflow_dispatch:
    inputs:
      parallel_jobs:
        description: "Mozilla build parallelism (MOZ_PARALLEL_BUILD in the mozconfig). Lower = less RAM, slower."
        required: false
        default: "3"
        type: string
      debug_symbols:
        description: "Keep debug symbols (rustc debuginfo=2, -g). Needs far more RAM and disk."
        required: false
        default: false
        type: boolean
      publish_release:
        description: "After a successful build, publish a GitHub release (tag = ProductVersion of parrot.exe) with the installer, the package zip and sha256sums.txt. This is what Parrot-WinUpdater downloads."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360

    container:
      image: librewolf.dev/librewolf/bsys6:windows

    env:
      HOME: /root
      MOZBUILD_STATE_PATH: /root/.mozbuild
      DIAG_DIR: ci-diagnostics

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Environment snapshot
        shell: bash
        run: |
          mkdir -p "$DIAG_DIR"
          {
            echo "== uname =="; uname -a
            echo "== nproc =="; nproc
            echo "== meminfo =="; grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo
            echo "== cgroup =="
            for f in memory.max memory.swap.max; do echo -n "$f: "; cat /sys/fs/cgroup/$f 2>/dev/null || echo n/a; done
            echo "== disk =="; df -h . /tmp /root 2>/dev/null
            echo "== bsys6 HEAD =="; git ls-remote https://librewolf.dev/librewolf/bsys6.git HEAD 2>&1 || true
            echo "== rustc =="; rustc --version 2>&1 || true
          } 2>&1 | tee "$DIAG_DIR/environment.txt"

      - name: Fetch Firefox source
        run: make fetch FF_CHANNEL=releases FF_BUILD=build1

      - name: Apply CI resource tuning to mozconfig
        shell: bash
        env:
          PARALLEL_JOBS: ${{ inputs.parallel_jobs }}
          KEEP_DEBUG_SYMBOLS: ${{ inputs.debug_symbols }}
        run: |
          [[ "$PARALLEL_JOBS" =~ ^[1-9][0-9]?$ ]] || { echo "parallel_jobs must be a number"; exit 1; }
          {
            echo
            echo "# --- CI resource tuning (appended by windows-build.yml) ---"
            echo "mk_add_options MOZ_PARALLEL_BUILD=${PARALLEL_JOBS}"
            if [ "$KEEP_DEBUG_SYMBOLS" != "true" ]; then
              echo "ac_add_options --disable-debug-symbols"
            fi
          } >> assets/mozconfig.new
          tail -n 6 assets/mozconfig.new

      - name: Build Windows package
        shell: bash
        run: |
          python3 scripts/ci-monitor.py run "$DIAG_DIR" 10 &
          MON_PID=$!
          trap 'kill "$MON_PID" 2>/dev/null || true; wait "$MON_PID" 2>/dev/null || true' EXIT
          make test-windows 2>&1 | tee "$DIAG_DIR/build.log"

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$DIAG_DIR/mozbuild"
          # testing.mk only runs `rm -rf bsys6` after success, so on failure this still exists.
          src=$(ls -d bsys6/SOURCEDIR/librewolf-*/ 2>/dev/null | head -n1 || true)
          if [ -n "$src" ]; then
            cp -v "${src}mozconfig" "$DIAG_DIR/mozconfig.used" || true
            for obj in "${src}"obj-*; do
              [ -d "$obj/.mozbuild/logs" ] && cp -r "$obj/.mozbuild/logs" "$DIAG_DIR/mozbuild/" || true
              [ -f "$obj/config.log" ] && cp "$obj/config.log" "$DIAG_DIR/mozbuild/" || true
              du -sh "$obj" >> "$DIAG_DIR/sizes.txt" 2>/dev/null || true
            done
          fi
          cat /sys/fs/cgroup/memory.events > "$DIAG_DIR/cgroup-memory-events.txt" 2>/dev/null || true
          cat /sys/fs/cgroup/memory.peak   > "$DIAG_DIR/cgroup-memory-peak.txt"   2>/dev/null || true
          df -h > "$DIAG_DIR/df-final.txt" || true
          if [ -f "$DIAG_DIR/build.log" ]; then
            tail -n 3000 "$DIAG_DIR/build.log" > "$DIAG_DIR/build-tail.log"
            grep -nEi 'signal: 9|SIGKILL|Killed|No space left|out of memory' "$DIAG_DIR/build.log" | head -n 200 > "$DIAG_DIR/build-errors.txt" || true
            gzip -9 "$DIAG_DIR/build.log"
          fi
          python3 scripts/ci-monitor.py summary "$DIAG_DIR" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parrot-build-diagnostics
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Rename package to Parrot
        shell: bash
        run: |
          shopt -s nullglob
          for f in librewolf-*.zip; do
            mv -v "$f" "parrot-${f#librewolf-}"
          done

      - name: Verify package contains parrot.exe
        shell: bash
        run: |
          shopt -s nullglob
          zips=(parrot-*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No parrot-*.zip was produced"
            exit 1
          fi
          python3 - "${zips[@]}" <<'PY'
          import posixpath
          import sys
          import zipfile

          failed = False
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              base = lambda n: posixpath.basename(n).lower()
              parrot = [n for n in names if base(n) == "parrot.exe"]
              librewolf = [n for n in names if base(n) == "librewolf.exe"]
              ok = len(parrot) == 1 and parrot[0].count("/") <= 1 and not librewolf
              print(f"{path}: {'OK' if ok else 'FAILED'} parrot.exe={parrot} librewolf.exe={librewolf}")
              failed |= not ok
          if failed:
              print("::error::The package must contain exactly one parrot.exe (top-level folder) and no librewolf.exe")
              sys.exit(1)
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parrot-windows
          path: |
            parrot-*.zip
            librewolf-*.zip
            mozconfig.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-installer:
    name: Build installer
    needs: build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Checkout Parrot-WinUpdater
        uses: actions/checkout@v6
        with:
          repository: BentendoYT/Parrot-winupdater
          path: winupdater

      - name: Download packaged build
        uses: actions/download-artifact@v4
        with:
          name: parrot-windows
          path: dist

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis unzip

      - name: Build installer
        shell: bash
        env:
          UPDATER_DIR: ${{ github.workspace }}/winupdater
        run: |
          shopt -s nullglob
          echo "WinUpdater commit: $(git -C winupdater rev-parse HEAD)"
          sha256sum winupdater/Parrot-WinUpdater.exe
          zips=(dist/parrot-*-windows-x86_64-package.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one parrot-*-windows-x86_64-package.zip, found ${#zips[@]}"
            ls -l dist
            exit 1
          fi
          bash scripts/build-installer.sh "${zips[0]}" installer-out

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: parrot-installer
          path: |
            installer-out/parrot-*-setup.exe
            installer-out/sha256sums.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub release
    if: ${{ inputs.publish_release }}
    needs: build-installer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: parrot-windows
          path: dist

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: parrot-installer
          path: dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(dist/parrot-*-windows-x86_64-package.zip)
          setups=(dist/parrot-*-windows-x86_64-setup.exe)
          if [ "${#zips[@]}" -ne 1 ] || [ "${#setups[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one package zip and one setup.exe in dist/"
            ls -l dist
            exit 1
          fi

          python3 -m venv .venv
          .venv/bin/pip install --quiet pefile
          tag="$(.venv/bin/python scripts/exe-version.py "${zips[0]}")"
          if [ -z "$tag" ]; then
            echo "::error::Could not read ProductVersion from parrot.exe"
            exit 1
          fi
          echo "Release tag (= ProductVersion of parrot.exe): $tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Parrot-WinUpdater only sees a new version when ProductVersion of parrot.exe changes."
            exit 1
          fi

          # "<sha256>  <file>" lines, the format Parrot-WinUpdater reads from sha256sums.txt
          (cd dist && sha256sum "$(basename "${setups[0]}")" "$(basename "${zips[0]}")" > sha256sums.txt)
          cat dist/sha256sums.txt

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Parrot Browser $tag" \
            --notes "Parrot Browser $tag for Windows x64. Unsigned build: Windows SmartScreen may warn. Verify downloads with sha256sums.txt." \
            --latest \
            "${setups[0]}" "${zips[0]}" dist/sha256sums.txt
